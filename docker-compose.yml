services:
  postgres:
    image: postgres:17-alpine
    container_name: merchant-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: merchant_ops
      POSTGRES_USER: merchant_ops
      POSTGRES_PASSWORD: merchant_ops_dev_password
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U merchant_ops -d merchant_ops']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
